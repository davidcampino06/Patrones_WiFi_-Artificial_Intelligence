# Builds the Windows installer of the agent (WiFiSenseAgente.exe) with PyInstaller and publishes it in the release
# "agente", which is the link Mi Wi-Fi and the team panel offer for download. Runs when the agent changes on main, or
# by hand. On a Pull Request it only tests and builds (on real Windows, so the system counters are tested too).
name: Agente para Windows

on:
  push:
    branches: [main]
    paths: ["agent/**", "tests/test_agent.py", "tests/test_windows_install.py", "tests/test_wifi_scan.py",
            "tests/test_agent_v2.py", "tests/test_router_sources.py", ".github/workflows/agente-windows.yml"]
  pull_request:
    paths: ["agent/**", "tests/test_agent.py", "tests/test_windows_install.py", "tests/test_wifi_scan.py",
            "tests/test_agent_v2.py", "tests/test_router_sources.py", ".github/workflows/agente-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probar el agente
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest --noconftest -q tests/test_agent.py tests/test_windows_install.py tests/test_wifi_scan.py `
            tests/test_agent_v2.py tests/test_router_sources.py

      - name: Construir WiFiSenseAgente.exe
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --noconsole --name WiFiSenseAgente --paths agent agent/app.py

      - name: Comprobar que el programa arranca
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\WiFiSenseAgente.exe -ArgumentList "pair","X" -PassThru -Wait
          if ($p.ExitCode -ne 1) { throw "exit code $($p.ExitCode)" }

      # The runner has no Wi-Fi adapter: the real scan must end with a known reason (not crash), which also proves
      # that the program carries the scan modules.
      - name: Escanear redes cercanas con el programa
        shell: pwsh
        run: |
          Start-Process -FilePath dist\WiFiSenseAgente.exe -ArgumentList "nearby","--output","cercanas.json" -Wait
          $scan = Get-Content cercanas.json -Raw | ConvertFrom-Json
          Write-Output "estado: $($scan.status) motivo: $($scan.failureReason) herramienta: $($scan.scanTool)"
          if ($scan.scanTool -ne "NETSH") { throw "no usó netsh" }
          if ($scan.status -eq "FAILED" -and -not $scan.failureReason) { throw "falló sin motivo" }
          if ((Get-Content cercanas.json -Raw) -match "([0-9a-f]{2}:){5}[0-9a-f]{2}") { throw "salió una MAC" }

      - uses: actions/upload-artifact@v7
        with:
          name: WiFiSenseAgente
          path: dist/WiFiSenseAgente.exe

      - name: Publicar en la versión "agente"
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: agente
          name: Agente WiFiSense para Windows
          body: |
            Instalador del agente WiFiSense para Windows 10 y 11. Descárgalo desde Mi Wi-Fi > Agente WiFiSense (o,
            para el sensor de una red del equipo, desde el panel > Redes > Conectar sensor), ábrelo con doble clic y
            pega el código de instalación.
          files: dist/WiFiSenseAgente.exe
          make_latest: false
