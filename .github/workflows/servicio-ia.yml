# Checks every change of the AI service before it reaches Railway: all the tests (model, training, diagnosis, quality,
# security, channel, agent and API), the known vulnerabilities of the Python packages and the Docker image Railway
# builds (from a mirror of its base image, because public.ecr.aws limits the downloads of GitHub machines). The Windows
# installer of the agent has its own workflow (agente-windows.yml). Runs on every Pull Request and on main.
name: Servicio de IA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servicio-ia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Vulnerabilidades conocidas en los paquetes
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      # public.ecr.aws limits anonymous downloads ("429 Data limit exceeded") and GitHub machines share addresses: the
      # script takes the same official Python image from mirror.gcr.io first, falls back to public.ecr.aws, retries
      # and writes the cause of each failed attempt as an annotation (see .github/scripts/construir-imagen.sh).
      - name: Construir la imagen de Railway
        run: bash .github/scripts/construir-imagen.sh
